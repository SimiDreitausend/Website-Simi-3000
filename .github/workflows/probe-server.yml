# One-off, read-only: log in to one.com with the deploy secrets and list the folders, to find
# the web root. Run by hand; delete once the deploy workflow exists. Logs are public — this
# prints folder names only.
name: Probe server

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get install -y -qq sshpass > /dev/null
      - name: Can the runner reach the server, and do its keys match the pinned ones?
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
        run: |
          ssh-keyscan -T 10 "$SFTP_HOST" 2>/dev/null | grep -v '^#' | ssh-keygen -lf - || echo "keyscan failed"
          echo "pinned:"; ssh-keygen -lf .github/one-com-known-hosts
      - name: List folders
        env:
          SSHPASS: ${{ secrets.SFTP_PASSWORD }}
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_USER: ${{ secrets.SFTP_USER }}
        run: |
          printf 'ls -la webroots/by-route\nls -la webroots/e9fe03fc/\n' > batch
          sshpass -e sftp -v -o BatchMode=no -b batch \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile=.github/one-com-known-hosts \
            -o PubkeyAuthentication=no -o PreferredAuthentications=password,keyboard-interactive \
            "$SFTP_USER@$SFTP_HOST" 2>&1 | grep -vE '^debug1: (Reading|kex|compat|Local|Remote|SSH2_MSG|expecting|rekey|channel|Sending env|pledge|client_input|Requesting|Entering|Sending subsystem|Server accepts|Will attempt)'
