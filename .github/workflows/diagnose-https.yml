# Throwaway: find which variable tells one.com's Apache that a request came over HTTPS.
# Writes a test folder on staging, fetches it over http and https, deletes it. Delete this file after.
name: Diagnose HTTPS

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    env:
      RCLONE_SFTP_HOST: ${{ secrets.SFTP_HOST }}
      RCLONE_SFTP_USER: ${{ secrets.SFTP_USER }}
      RCLONE_SFTP_KNOWN_HOSTS_FILE: .github/one-com-known-hosts
      RCLONE_SFTP_SHELL_TYPE: none
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get install -y -qq rclone > /dev/null
      - name: Upload, fetch, delete
        env:
          SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
        run: |
          export RCLONE_SFTP_PASS="$(rclone obscure "$SFTP_PASSWORD")"
          echo "::add-mask::$RCLONE_SFTP_PASS"
          mkdir diag
          cat > diag/.htaccess <<'HT'
          Require all granted
          RewriteEngine Off
          Header always set X-Env-HTTPS "%{HTTPS}e"
          Header always set X-Env-Proto "%{HTTP_X_FORWARDED_PROTO}e"
          <If "%{HTTPS} == 'on'">
            Header always set X-Expr-HTTPS "on"
          </If>
          <If "%{REQUEST_SCHEME} == 'https'">
            Header always set X-Expr-Scheme "https"
          </If>
          <If "%{HTTP:X-Forwarded-Proto} == 'https'">
            Header always set X-Expr-XFP "https"
          </If>
          <If "reqenv('HTTPS') == 'on'">
            Header always set X-Expr-Reqenv "on"
          </If>
          HT
          cat > diag/s.php <<'PHP'
          <?php foreach (['HTTPS','REQUEST_SCHEME','SERVER_PORT','HTTP_X_FORWARDED_PROTO','HTTP_X_FORWARDED_SSL','HTTP_X_FORWARDED_PORT','REDIRECT_HTTPS'] as $k) echo $k, '=', $_SERVER[$k] ?? '-', "\n";
          PHP
          rclone copy diag :sftp:webroots/by-route/staging.simi3000.com_/_diag
          for scheme in http https; do
            echo "===== $scheme"
            curl -sS -D - "$scheme://staging.simi3000.com/_diag/s.php" | grep -iE '^(HTTP/|x-env|x-expr)|=' || true
          done
          rclone purge :sftp:webroots/by-route/staging.simi3000.com_/_diag
          echo "cleaned up"
